<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accounting & Inventory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo-wrap">
        <img src="logo.png" alt="logo" />
        <h3 data-i18n="app_title"></h3>
      </div>

      <div class="user-badge">
        <div class="row" style="justify-content: space-between; align-items: center;">
          <div id="userName">-</div>
          <button id="logoutBtn" class="btn ghost small" data-i18n="logout"></button>
        </div>
        <div id="userRole" class="role">-</div>
      </div>

      <div class="row">
        <button class="btn ghost small" data-lang="ar" data-i18n="arabic"></button>
        <button class="btn ghost small" data-lang="en">English</button>
      </div>

      <nav class="menu">
        <button class="nav-item" data-icon="📊" data-section="reports" data-i18n="reports"></button>
        <button class="nav-item" data-icon="🧾" data-section="orders" data-i18n="orders"></button>
        <button class="nav-item" data-icon="👥" data-section="customers" data-i18n="customers"></button>
        <button class="nav-item" data-icon="📦" data-section="products" data-i18n="products"></button>
        <button class="nav-item" data-icon="🗂" data-section="productCategories" data-i18n="product_categories"></button>
        <button class="nav-item" data-icon="⚖" data-section="units" data-i18n="units"></button>
        <button class="nav-item" data-icon="🧷" data-section="itemCards" data-i18n="item_cards"></button>
        <button class="nav-item" data-icon="🏬" data-section="storageLocations" data-i18n="storage_locations"></button>
        <button class="nav-item" data-icon="🌍" data-section="countryOrigins" data-i18n="country_origins"></button>
        <button class="nav-item" data-icon="⏳" data-section="productionFollowUp" data-i18n="production_followup"></button>

        <div class="nav-group" data-group="inventory">
          <button class="nav-item group-toggle" data-icon="🏷">
            <span data-i18n="inventory"></span>
            <span class="group-arrow">▸</span>
          </button>
          <div class="nav-children">
            <button class="nav-item" data-icon="🧱" data-section="stockMaterials" data-group="inventory" data-i18n="stock_materials"></button>
            <button class="nav-item" data-icon="🗂" data-section="materialCategories" data-group="inventory" data-i18n="material_categories"></button>
            <button class="nav-item" data-icon="📤" data-section="issue" data-group="inventory" data-i18n="issue"></button>
            <button class="nav-item" data-icon="🏭" data-section="production" data-group="inventory" data-i18n="production"></button>
            <button class="nav-item" data-icon="👷" data-section="productionStaff" data-group="inventory" data-i18n="production_staff"></button>
            <button class="nav-item" data-icon="🧮" data-section="inventoryCount" data-group="inventory" data-i18n="inventory_count"></button>
            <button class="nav-item" data-icon="📥" data-section="receiving" data-group="inventory" data-i18n="receiving"></button>
            <button class="nav-item" data-icon="🔁" data-section="transfers" data-group="inventory" data-i18n="transfers"></button>
            <button class="nav-item" data-icon="🧭" data-section="cashierTransferRequests" data-group="inventory" data-i18n="cashier_transfer_requests"></button>
            <button class="nav-item" data-icon="↩" data-section="stockReturn" data-group="inventory" data-i18n="stock_return"></button>
            <button class="nav-item" data-icon="♻" data-section="scrapReturn" data-group="inventory" data-i18n="scrap_return"></button>
          </div>
        </div>

        <div class="nav-group" data-group="suppliers">
          <button class="nav-item group-toggle" data-icon="🚚">
            <span data-i18n="suppliers"></span>
            <span class="group-arrow">▸</span>
          </button>
          <div class="nav-children">
            <button class="nav-item" data-icon="🏢" data-section="suppliers" data-group="suppliers" data-i18n="supplier_list"></button>
            <button class="nav-item" data-icon="🛒" data-section="purchase" data-group="suppliers" data-i18n="purchase"></button>
            <button class="nav-item" data-icon="↪" data-section="supplierReturn" data-group="suppliers" data-i18n="supplier_return"></button>
          </div>
        </div>

        <div class="nav-group" data-group="administration">
          <button class="nav-item group-toggle" data-icon="🛠">
            <span data-i18n="administration"></span>
            <span class="group-arrow">▸</span>
          </button>
          <div class="nav-children">
            <button class="nav-item" data-icon="📌" data-section="pendingStockMoves" data-group="administration" data-i18n="pending_stock_moves"></button>
            <button class="nav-item" data-icon="💻" data-section="devicesCashiers" data-group="administration" data-i18n="devices_cashier"></button>
            <button class="nav-item" data-icon="👤" data-section="users" data-group="administration" data-i18n="users"></button>
            <button class="nav-item" data-icon="🍽" data-section="tables" data-group="administration" data-i18n="tables"></button>
            <button class="nav-item" data-icon="🏬" data-section="branches" data-group="administration" data-i18n="branches"></button>
            <button class="nav-item" data-icon="📍" data-section="deliveryZones" data-group="administration" data-i18n="delivery_zones"></button>
            <button class="nav-item" data-icon="💸" data-section="deliveryPrices" data-group="administration" data-i18n="delivery_prices"></button>
            <button class="nav-item" data-icon="🏷" data-section="discounts" data-group="administration" data-i18n="discounts"></button>
            <button class="nav-item" data-icon="🧭" data-section="orderTypes" data-group="administration" data-i18n="order_types"></button>
            <button class="nav-item" data-icon="💳" data-section="paymentMethods" data-group="administration" data-i18n="payment_methods"></button>
          </div>
        </div>
      </nav>
    </aside>

    <main class="content">
      <div id="reorderNotice" class="notice hidden"></div>
      <section id="section-reports" class="section"></section>
      <section id="section-orders" class="section"></section>
      <section id="section-customers" class="section"></section>
      <section id="section-products" class="section"></section>
      <section id="section-productCategories" class="section"></section>
      <section id="section-units" class="section"></section>
      <section id="section-itemCards" class="section"></section>
      <section id="section-storageLocations" class="section"></section>
      <section id="section-countryOrigins" class="section"></section>
      <section id="section-productionFollowUp" class="section"></section>
      <section id="section-stockMaterials" class="section"></section>
      <section id="section-materialCategories" class="section"></section>
      <section id="section-issue" class="section"></section>
      <section id="section-production" class="section"></section>
      <section id="section-inventoryCount" class="section"></section>
      <section id="section-receiving" class="section"></section>
      <section id="section-transfers" class="section"></section>
      <section id="section-cashierTransferRequests" class="section"></section>
      <section id="section-stockReturn" class="section"></section>
      <section id="section-scrapReturn" class="section"></section>
      <section id="section-suppliers" class="section"></section>
      <section id="section-purchase" class="section"></section>
      <section id="section-supplierReturn" class="section"></section>
      <section id="section-pendingStockMoves" class="section"></section>
      <section id="section-devicesCashiers" class="section"></section>
      <section id="section-users" class="section"></section>
      <section id="section-tables" class="section"></section>
      <section id="section-warehouseStaff" class="section"></section>
      <section id="section-productionStaff" class="section"></section>
      <section id="section-branches" class="section"></section>
      <section id="section-deliveryZones" class="section"></section>
      <section id="section-deliveryPrices" class="section"></section>
      <section id="section-discounts" class="section"></section>
      <section id="section-orderTypes" class="section"></section>
      <section id="section-paymentMethods" class="section"></section>
    </main>
  </div>

  <div id="loginOverlay" class="overlay">
    <div class="modal card">
      <h2 data-i18n="login_title"></h2>
      <p class="helper" data-i18n="access_code"></p>
      <input id="loginCode" class="input" data-i18n-placeholder="enter_code" />
      <button id="loginBtn" class="btn primary" data-i18n="login"></button>
      <p id="loginError" class="helper" style="color: var(--danger);"></p>
    </div>
  </div>

  <div id="detailOverlay" class="overlay hidden">
    <div class="modal card" style="max-width: 560px; text-align: start;">
      <h3 data-i18n="order_details"></h3>
      <div id="detailBody"></div>
      <button id="detailClose" class="btn ghost" data-i18n="cancel"></button>
    </div>
  </div>

  <div id="discountOverlay" class="overlay hidden">
    <div class="modal card" style="max-width: 560px; text-align: start;">
      <h3 data-i18n="discount_usage"></h3>
      <div id="discountBody"></div>
      <button id="discountClose" class="btn ghost" data-i18n="cancel"></button>
    </div>
  </div>

  <div id="importProgressOverlay" class="overlay hidden">
    <div class="modal card import-progress-modal">
      <div class="row" style="justify-content: space-between; align-items: center;">
        <h3 id="importProgressTitle" data-i18n="importing"></h3>
        <span id="importProgressPercent" class="tag">0%</span>
      </div>
      <p id="importProgressSubtitle" class="helper" data-i18n="importing_to_system"></p>
      <div class="import-progress-track" aria-hidden="true">
        <div id="importProgressFill" class="import-progress-fill"></div>
      </div>
      <div class="row import-progress-meta">
        <span id="importProgressCount" class="helper">0 / 0</span>
        <span id="importProgressErrors" class="helper import-progress-errors"></span>
      </div>
    </div>
  </div>

  <div id="productModal" class="overlay hidden">
    <div class="modal card" style="max-width: 720px; text-align: start;">
      <h3 data-i18n="products"></h3>
      <form id="productForm" class="grid two">
        <div>
          <label class="tag" for="productCode" data-i18n="product_code"></label>
          <input id="productCode" class="input" readonly />
        </div>
        <div>
          <label class="tag" for="productBarcode" data-i18n="barcode_value"></label>
          <div class="row">
            <input id="productBarcode" class="input" />
            <button type="button" id="generateBarcode" class="btn ghost small" data-i18n="generate_code"></button>
          </div>
        </div>
        <div>
          <label class="tag" for="productNameAr" data-i18n="name_ar"></label>
          <input id="productNameAr" class="input" />
        </div>
        <div>
          <label class="tag" for="productNameEn" data-i18n="name_en"></label>
          <input id="productNameEn" class="input" />
        </div>
        <div>
          <label class="tag" for="productCost" data-i18n="cost"></label>
          <input id="productCost" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="productPrice" data-i18n="sale_price"></label>
          <input id="productPrice" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="productUnit" data-i18n="units"></label>
          <select id="productUnit" class="input"></select>
        </div>
        <div>
          <label class="tag" for="productCountryOrigin" data-i18n="country_origin"></label>
          <select id="productCountryOrigin" class="input"></select>
        </div>
        <div id="productUnitDefinitionWrap" class="hidden" style="grid-column: 1 / -1;">
          <button type="button" id="productUnitDefinitionToggle" class="btn ghost small" data-i18n="unit_definition"></button>
          <div id="productUnitDefinitionFields" class="row hidden" style="margin-top: 8px; flex-wrap: wrap;">
            <input id="productUnitDefinitionQty" class="input" type="text" data-i18n-placeholder="quantity" style="max-width: 180px;" />
            <select id="productUnitDefinitionUnit" class="input" style="max-width: 220px;"></select>
          </div>
        </div>
        <div>
          <label class="tag" for="productOpeningQty" data-i18n="opening_qty"></label>
          <input id="productOpeningQty" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="productMinStock" data-i18n="min_stock"></label>
          <input id="productMinStock" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="productReorderPoint" data-i18n="reorder_point"></label>
          <input id="productReorderPoint" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="productMaxStock" data-i18n="max_stock"></label>
          <input id="productMaxStock" class="input" type="number" />
        </div>
        <div style="grid-column: 1 / -1;">
          <label class="tag" data-i18n="barcode_preview"></label>
          <canvas id="barcodePreview" height="80"></canvas>
          <div class="row" style="margin-top: 8px;">
            <button type="button" id="downloadBarcode" class="btn ghost small" data-i18n="download_barcode"></button>
          </div>
        </div>
        <div class="row" style="grid-column: 1 / -1; justify-content: space-between;">
          <div></div>
          <div class="row">
            <button type="submit" class="btn primary" data-i18n="save"></button>
            <button type="button" id="productCancel" class="btn ghost" data-i18n="cancel"></button>
          </div>
        </div>
        <p id="productError" class="helper form-error"></p>
      </form>
    </div>
  </div>

  <div id="categoryModal" class="overlay hidden">
    <div class="modal card" style="max-width: 480px; text-align: start;">
      <h3 data-i18n="product_categories"></h3>
      <form id="categoryForm" class="grid two">
        <div>
          <label class="tag" for="categoryNameAr" data-i18n="name_ar"></label>
          <input id="categoryNameAr" class="input" />
        </div>
        <div>
          <label class="tag" for="categoryNameEn" data-i18n="name_en"></label>
          <input id="categoryNameEn" class="input" />
        </div>
        <div class="row" style="grid-column: 1 / -1; justify-content: flex-end;">
          <button type="submit" class="btn primary" data-i18n="save"></button>
          <button type="button" id="categoryCancel" class="btn ghost" data-i18n="cancel"></button>
        </div>
        <p id="categoryError" class="helper form-error"></p>
      </form>
    </div>
  </div>

  <div id="categoryProductsModal" class="overlay hidden">
    <div class="modal card" style="max-width: 720px; text-align: start;">
      <h3 data-i18n="products"></h3>
      <div class="row" style="margin-bottom: 12px;">
        <input id="categoryProductSearch" class="input" data-i18n-placeholder="search" />
      </div>
      <div id="categoryProductList" class="grid two" style="max-height: 300px; overflow: auto;"></div>
      <div class="row" style="margin-top: 12px; justify-content: flex-end;">
        <button id="categoryProductsSave" class="btn primary" data-i18n="add"></button>
        <button id="categoryProductsCancel" class="btn ghost" data-i18n="cancel"></button>
      </div>
    </div>
  </div>

  <div id="materialModal" class="overlay hidden">
    <div class="modal card" style="max-width: 720px; text-align: start;">
      <h3 data-i18n="stock_materials"></h3>
      <form id="materialForm" class="grid two">
        <div>
          <label class="tag" for="materialCode" data-i18n="product_code"></label>
          <input id="materialCode" class="input" readonly />
        </div>
        <div>
          <label class="tag" for="materialBarcode" data-i18n="barcode_value"></label>
          <div class="row">
            <input id="materialBarcode" class="input" />
            <button type="button" id="generateMaterialBarcode" class="btn ghost small" data-i18n="generate_code"></button>
          </div>
        </div>
        <div>
          <label class="tag" for="materialNameAr" data-i18n="name_ar"></label>
          <input id="materialNameAr" class="input" />
        </div>
        <div>
          <label class="tag" for="materialNameEn" data-i18n="name_en"></label>
          <input id="materialNameEn" class="input" />
        </div>
        <div>
          <label class="tag" for="materialCost" data-i18n="cost"></label>
          <input id="materialCost" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="materialUnit" data-i18n="units"></label>
          <select id="materialUnit" class="input"></select>
        </div>
        <div>
          <label class="tag" for="materialCountryOrigin" data-i18n="country_origin"></label>
          <select id="materialCountryOrigin" class="input"></select>
        </div>
        <div id="materialUnitDefinitionWrap" class="hidden" style="grid-column: 1 / -1;">
          <button type="button" id="materialUnitDefinitionToggle" class="btn ghost small" data-i18n="unit_definition"></button>
          <div id="materialUnitDefinitionFields" class="row hidden" style="margin-top: 8px; flex-wrap: wrap;">
            <input id="materialUnitDefinitionQty" class="input" type="text" data-i18n-placeholder="quantity" style="max-width: 180px;" />
            <select id="materialUnitDefinitionUnit" class="input" style="max-width: 220px;"></select>
          </div>
        </div>
        <div>
          <label class="tag" for="materialOpeningQty" data-i18n="opening_qty"></label>
          <input id="materialOpeningQty" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="materialMinStock" data-i18n="min_stock"></label>
          <input id="materialMinStock" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="materialReorderPoint" data-i18n="reorder_point"></label>
          <input id="materialReorderPoint" class="input" type="number" />
        </div>
        <div>
          <label class="tag" for="materialMaxStock" data-i18n="max_stock"></label>
          <input id="materialMaxStock" class="input" type="number" />
        </div>
        <div style="grid-column: 1 / -1;">
          <label class="tag" data-i18n="barcode_preview"></label>
          <canvas id="materialBarcodePreview" height="80"></canvas>
          <div class="row" style="margin-top: 8px;">
            <button type="button" id="downloadMaterialBarcode" class="btn ghost small" data-i18n="download_barcode"></button>
          </div>
        </div>
        <div class="row" style="grid-column: 1 / -1; justify-content: space-between;">
          <div></div>
          <div class="row">
            <button type="submit" class="btn primary" data-i18n="save"></button>
            <button type="button" id="materialCancel" class="btn ghost" data-i18n="cancel"></button>
          </div>
        </div>
        <p id="materialError" class="helper form-error"></p>
      </form>
    </div>
  </div>

  <div id="materialCategoryModal" class="overlay hidden">
    <div class="modal card" style="max-width: 480px; text-align: start;">
      <h3 data-i18n="material_categories"></h3>
      <form id="materialCategoryForm" class="grid two">
        <div>
          <label class="tag" for="materialCategoryNameAr" data-i18n="name_ar"></label>
          <input id="materialCategoryNameAr" class="input" />
        </div>
        <div>
          <label class="tag" for="materialCategoryNameEn" data-i18n="name_en"></label>
          <input id="materialCategoryNameEn" class="input" />
        </div>
        <div class="row" style="grid-column: 1 / -1; justify-content: flex-end;">
          <button type="submit" class="btn primary" data-i18n="save"></button>
          <button type="button" id="materialCategoryCancel" class="btn ghost" data-i18n="cancel"></button>
        </div>
        <p id="materialCategoryError" class="helper form-error"></p>
      </form>
    </div>
  </div>

  <div id="materialCategoryProductsModal" class="overlay hidden">
    <div class="modal card" style="max-width: 720px; text-align: start;">
      <h3 data-i18n="stock_materials"></h3>
      <div class="row" style="margin-bottom: 12px;">
        <input id="materialCategoryProductSearch" class="input" data-i18n-placeholder="search" />
      </div>
      <div id="materialCategoryProductList" class="grid two" style="max-height: 300px; overflow: auto;"></div>
      <div class="row" style="margin-top: 12px; justify-content: flex-end;">
        <button id="materialCategoryProductsSave" class="btn primary" data-i18n="add"></button>
        <button id="materialCategoryProductsCancel" class="btn ghost" data-i18n="cancel"></button>
      </div>
    </div>
  </div>

  <div id="storageLocationModal" class="overlay hidden">
    <div class="modal card" style="max-width: 480px; text-align: start;">
      <h3 data-i18n="storage_locations"></h3>
      <form id="storageLocationForm" class="grid two">
        <div>
          <label class="tag" for="storageLocationNameAr" data-i18n="name_ar"></label>
          <input id="storageLocationNameAr" class="input" />
        </div>
        <div>
          <label class="tag" for="storageLocationNameEn" data-i18n="name_en"></label>
          <input id="storageLocationNameEn" class="input" />
        </div>
        <div class="row" style="grid-column: 1 / -1; justify-content: flex-end;">
          <button type="submit" class="btn primary" data-i18n="save"></button>
          <button type="button" id="storageLocationCancel" class="btn ghost" data-i18n="cancel"></button>
        </div>
        <p id="storageLocationError" class="helper form-error"></p>
      </form>
    </div>
  </div>

  <div id="storageItemsModal" class="overlay hidden">
    <div class="modal card" style="max-width: 720px; text-align: start;">
      <h3 data-i18n="storage_locations"></h3>
      <div class="row" style="margin-bottom: 12px;">
        <input id="storageItemsSearch" class="input" data-i18n-placeholder="search" />
      </div>
      <div id="storageItemsList" class="grid two" style="max-height: 300px; overflow: auto;"></div>
      <div class="row" style="margin-top: 12px; justify-content: flex-end;">
        <button id="storageItemsSave" class="btn primary" data-i18n="add"></button>
        <button id="storageItemsCancel" class="btn ghost" data-i18n="cancel"></button>
      </div>
    </div>
  </div>

  <div id="qtyModal" class="overlay hidden">
    <div class="modal card" style="max-width: 420px; text-align: center;">
      <h3 id="qtyModalTitle"></h3>
      <div id="qtyModalUnit" class="tag" style="margin-top: 8px;"></div>
      <div id="qtyModalStock" class="helper" style="margin-top: 4px;"></div>
      <div id="qtyModalDisplay" class="qty-display">0</div>
      <div class="keypad">
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key=",">,</button>
        <button type="button" data-key="back">⌫</button>
      </div>
      <div class="row" style="justify-content: center; gap: 12px; margin-top: 12px;">
        <button id="qtyModalConfirm" class="btn primary" data-i18n="add"></button>
        <button id="qtyModalCancel" class="btn ghost" data-i18n="cancel"></button>
      </div>
      <p id="qtyModalError" class="helper form-error"></p>
    </div>
  </div>

  <div id="productionDateModal" class="overlay hidden">
    <div class="modal card" style="max-width: 420px; text-align: start;">
      <h3 data-i18n="production_dates"></h3>
      <div class="grid two">
        <div>
          <label class="tag" for="productionDateInput" data-i18n="production_date"></label>
          <input id="productionDateInput" class="input" type="date" />
        </div>
        <div>
          <label class="tag" for="expiryDateInput" data-i18n="expiry_date"></label>
          <input id="expiryDateInput" class="input" type="date" />
        </div>
      </div>
      <div class="row" style="justify-content: flex-end; margin-top: 12px;">
        <button id="productionDateNext" class="btn primary" data-i18n="next"></button>
        <button id="productionDateCancel" class="btn ghost" data-i18n="cancel"></button>
      </div>
      <p id="productionDateError" class="helper form-error"></p>
    </div>
  </div>

  <div id="productionLinkModal" class="overlay hidden">
    <div class="modal card" style="max-width: 720px; text-align: start;">
      <h3 data-i18n="link_issue"></h3>
      <div id="productionIssueList" class="grid two" style="max-height: 320px; overflow: auto;"></div>
      <div class="row" style="margin-top: 12px; justify-content: flex-end;">
        <button id="productionLinkConfirm" class="btn primary" data-i18n="confirm"></button>
        <button id="productionLinkCancel" class="btn ghost" data-i18n="cancel"></button>
      </div>
    </div>
  </div>

  <div id="issueDetailOverlay" class="overlay hidden">
    <div class="modal card" style="max-width: 720px; text-align: start;">
      <h3 data-i18n="issue_details"></h3>
      <div id="issueDetailBody"></div>
      <button id="issueDetailClose" class="btn ghost" data-i18n="cancel"></button>
    </div>
  </div>

  <div id="orderEditOverlay" class="overlay hidden">
    <div class="modal card" style="max-width: 760px; text-align: start;">
      <h3 data-i18n="edit_order"></h3>
      <form id="orderEditForm" class="grid two">
        <div>
          <label class="tag" data-i18n="customer_name"></label>
          <select id="orderCustomer" class="input"></select>
        </div>
        <div>
          <label class="tag" data-i18n="customer_phone"></label>
          <input id="orderCustomerPhone" class="input" />
        </div>
        <div>
          <label class="tag" data-i18n="delivery_zone"></label>
          <select id="orderZone" class="input"></select>
        </div>
        <div>
          <label class="tag" data-i18n="delivery_fee"></label>
          <input id="orderDeliveryFee" class="input" type="number" />
        </div>
        <div>
          <label class="tag" data-i18n="payment_method"></label>
          <select id="orderPayment" class="input"></select>
        </div>
        <div>
          <label class="tag" data-i18n="branch"></label>
          <select id="orderBranch" class="input"></select>
        </div>
        <div style="grid-column: 1 / -1;">
          <label class="tag" data-i18n="order_items"></label>
          <div id="orderItemsList" class="grid two"></div>
          <div class="row" style="margin-top: 8px;">
            <select id="orderAddProduct" class="input"></select>
            <input id="orderAddQty" class="input" type="number" value="1" style="max-width: 120px;" />
            <button type="button" id="orderAddBtn" class="btn ghost small" data-i18n="add_item"></button>
          </div>
        </div>
        <div class="row" style="grid-column: 1 / -1; justify-content: flex-end;">
          <button type="submit" class="btn primary" data-i18n="save"></button>
          <button type="button" id="orderDeleteBtn" class="btn danger" data-i18n="delete"></button>
          <button type="button" id="orderEditCancel" class="btn ghost" data-i18n="cancel"></button>
        </div>
        <p id="orderEditError" class="helper form-error"></p>
      </form>
    </div>
  </div>

  <div id="customerOrdersOverlay" class="overlay hidden">
    <div class="modal card" style="max-width: 720px; text-align: start;">
      <h3 data-i18n="orders"></h3>
      <div id="customerOrdersList"></div>
      <button id="customerOrdersClose" class="btn ghost" data-i18n="cancel"></button>
    </div>
  </div>

  <div id="unitModal" class="overlay hidden">
    <div class="modal card" style="max-width: 480px; text-align: start;">
      <h3 data-i18n="new_unit"></h3>
      <form id="unitForm" class="grid two">
        <div>
          <label class="tag" data-i18n="name_ar"></label>
          <input id="unitNameAr" class="input" />
        </div>
        <div>
          <label class="tag" data-i18n="name_en"></label>
          <input id="unitNameEn" class="input" />
        </div>
        <div class="row" style="grid-column: 1 / -1; justify-content: flex-end;">
          <button type="submit" class="btn primary" data-i18n="save"></button>
          <button type="button" id="unitCancel" class="btn ghost" data-i18n="cancel"></button>
        </div>
        <p id="unitError" class="helper form-error"></p>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="translation.js"></script>
  <script src="accounting.js"></script>
</body>
</html>
