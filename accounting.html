<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="admin_title">المحاسبة والمخازن</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a class="brand" href="index.html">
        <img src="logo.png" class="brand-logo" alt="logo" />
        <span data-i18n="app_title">نظام كاشير وإدارة</span>
      </a>
    </div>
    <div class="topbar-right">
      <span class="pill">
        <span data-i18n="label_user">المستخدم</span>: <b id="userLabel">-</b>
        <span class="sep">•</span>
        <span data-i18n="label_role">الدور</span>: <b id="roleLabel">-</b>
      </span>
      <button class="btn ghost" id="toggleLangBtn" data-i18n="btn_language">تغيير اللغة</button>
      <button class="btn danger" id="logoutBtn" data-i18n="btn_logout">خروج</button>
    </div>
  </div>

  <!-- Login -->
  <div class="page" id="loginPage">
    <div class="card">
      <h2 data-i18n="admin_login_title">دخول الإدارة</h2>
      <p class="muted" data-i18n="admin_login_note">
        الدخول يتطلب رمز. رمز المدير الافتراضي 123456 (يمكن تغييره من المستخدمين).
      </p>

      <div class="grid2" style="grid-template-columns:1fr;">
  <div class="field">
    <label data-i18n="label_pin">رمز الدخول</label>
    <input id="pinInput" inputmode="numeric" maxlength="12" placeholder="123456" />
    <small class="hint" data-i18n="hint_pin">أدخل رمز المستخدم</small>
  </div>
</div>


      <div class="row mt">
        <button class="btn primary" id="loginBtn" data-i18n="btn_login">دخول</button>
        <a class="btn" href="index.html" data-i18n="btn_back_home">رجوع للرئيسية</a>
      </div>

      <div class="alert warn mt" id="loginAlert" style="display:none;"></div>
    </div>
  </div>

  <!-- App -->
  <div class="appShell" id="appShell" style="display:none;">
    <aside class="sidebar">
      <div class="sidebarHead">
        <div class="sidebarTitle" data-i18n="admin_menu">القائمة</div>
        <div class="muted small" id="deviceIdLabel"></div>
      </div>

      <nav class="nav" id="nav">
        <button class="navItem" data-route="orders" data-i18n="nav_orders">الطلبات</button>
        <button class="navItem" data-route="customers" data-i18n="nav_customers">العملاء</button>
        <button class="navItem" data-route="products" data-i18n="nav_products">المنتجات</button>
        <button class="navItem" data-route="productCategories" data-i18n="nav_product_categories">تصنيفات المنتجات</button>
        <button class="navItem" data-route="units" data-i18n="nav_units">الوحدات</button>
        <button class="navItem" data-route="itemCards" data-i18n="nav_item_card">بطاقة الصنف</button>

        <div class="navGroup">
          <button class="navItem groupToggle" data-group="stores">
            <span data-i18n="nav_stores">المخازن</span>
            <span class="chev">▾</span>
          </button>
          <div class="groupBody" data-group-body="stores">
            <button class="navSub" data-route="stockMaterials" data-i18n="nav_stock_materials">مواد المخزون</button>
            <button class="navSub" data-route="materialCategories" data-i18n="nav_material_categories">تصنيفات المواد</button>
            <button class="navSub" data-route="storageLocations" data-i18n="nav_storage_locations">أماكن التخزين</button>
            <button class="navSub" data-route="issue" data-i18n="nav_issue">صرف</button>
            <button class="navSub" data-route="production" data-i18n="nav_production">انتاج</button>
            <button class="navSub" data-route="inventory" data-i18n="nav_inventory">جرد</button>
            <button class="navSub" data-route="receive" data-i18n="nav_receive">استلام</button>
            <button class="navSub" data-route="transfers" data-i18n="nav_transfers">تحويلات</button>
            <button class="navSub" data-route="returnStore" data-i18n="nav_return_store">مرتجع للمخزن</button>
            <button class="navSub" data-route="returnWaste" data-i18n="nav_return_waste">مرتجع توالف</button>
          </div>
        </div>

        <div class="navGroup">
          <button class="navItem groupToggle" data-group="suppliers">
            <span data-i18n="nav_suppliers_group">الموردون</span>
            <span class="chev">▾</span>
          </button>
          <div class="groupBody" data-group-body="suppliers">
            <button class="navSub" data-route="suppliers" data-i18n="nav_suppliers">الموردون</button>
            <button class="navSub" data-route="purchases" data-i18n="nav_purchases">الشراء</button>
            <button class="navSub" data-route="returnSupplier" data-i18n="nav_return_supplier">مرتجع للمورد</button>
          </div>
        </div>

        <div class="navGroup">
          <button class="navItem groupToggle" data-group="admin">
            <span data-i18n="nav_admin_group">الإدارة</span>
            <span class="chev">▾</span>
          </button>
          <div class="groupBody" data-group-body="admin">
            <button class="navSub" data-route="pendingStockMoves" data-i18n="nav_pending_stock">حركات مخزون معلقة</button>
            <button class="navSub" data-route="devices" data-i18n="nav_devices_cashier">الأجهزة والكاشير</button>
            <button class="navSub" data-route="users" data-i18n="nav_users">المستخدمين</button>
            <button class="navSub" data-route="warehouseEmployees" data-i18n="nav_warehouse_employees">موظفي المخازن</button>
            <button class="navSub" data-route="productionEmployees" data-i18n="nav_production_employees">موظفي الانتاج</button>
            <button class="navSub" data-route="branches" data-i18n="nav_branches">الفروع</button>
            <button class="navSub" data-route="deliveryZones" data-i18n="nav_delivery_zones">مناطق التوصيل</button>
            <button class="navSub" data-route="deliveryPrices" data-i18n="nav_delivery_prices">أسعار التوصيل</button>
            <button class="navSub" data-route="discounts" data-i18n="nav_discounts">خصومات</button>
            <button class="navSub" data-route="orderTypes" data-i18n="nav_order_types">انوع الطلب</button>
            <button class="navSub" data-route="paymentMethods" data-i18n="nav_payment_methods">طرق الدفع</button>
          </div>
        </div>
      </nav>
    </aside>

    <main class="content">
      <div class="contentHead">
        <h2 id="moduleTitle">-</h2>
        <div class="row">
          <span class="pill" id="livePill">
            <span data-i18n="label_live">تحديث لحظي</span>: <b data-i18n="yes">نعم</b>
          </span>
        </div>
      </div>

      <div id="moduleBody"></div>
    </main>
  </div>

  <div id="customModal" class="modal-overlay" style="display:none;">
  <div class="card modal-card">
    <div class="row between">
      <h3 id="modalTitle">عنوان النافذة</h3>
      <button class="btn mini ghost" onclick="closeCustomModal()">×</button>
    </div>
    <div id="modalFieldsContainer" class="stack mt">
      </div>
    <div class="row mt" style="justify-content: flex-end;">
      <button class="btn primary" id="modalConfirmBtn">حفظ</button>
      <button class="btn" onclick="closeCustomModal()">إلغاء</button>
    </div>
  </div>
</div>

  <script src="translation.js"></script>

  <!-- Firebase (Compat for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="accounting.js"></script>
</body>
</html>
