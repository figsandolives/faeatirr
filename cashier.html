<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashier</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <img src="logo.png" alt="logo" />
      <div>
        <div class="tag" data-i18n="cashier"></div>
        <strong id="branchDisplay">-</strong>
      </div>
    </div>
    <div class="info">
      <div>
        <div class="tag" data-i18n="cashier_name"></div>
        <div id="cashierDisplay">-</div>
      </div>
      <div>
        <div class="tag" data-i18n="branch"></div>
        <div id="branchName">-</div>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost small" id="switchCashier" data-i18n="switch_cashier"></button>
      <button class="btn ghost small" data-lang="ar" data-i18n="arabic"></button>
      <button class="btn ghost small" data-lang="en" data-i18n="english"></button>
    </div>
  </header>

  <main class="cashier-layout">
    <section class="card">
      <div class="row" style="justify-content: space-between;">
        <h2 data-i18n="products"></h2>
        <input id="searchProducts" class="input" style="max-width: 240px" data-i18n-placeholder="search_products" />
      </div>
      <div class="row" style="margin-top: 12px;">
        <label class="tag" data-i18n="categories"></label>
        <select id="categoryFilter"></select>
      </div>
      <div id="productList" class="product-grid"></div>
    </section>

    <section class="card">
      <h2 data-i18n="current_invoice"></h2>
      <div id="cartList" class="cart-list"></div>

      <div class="summary">
        <div class="row" style="justify-content: space-between;">
          <span data-i18n="subtotal"></span>
          <strong id="subtotalValue">0</strong>
        </div>
        <div class="row" style="justify-content: space-between; align-items: center;">
          <span data-i18n="discount"></span>
          <div class="row">
            <select id="discountType" style="width: 120px;">
              <option value="amount" data-i18n="discount_amount"></option>
              <option value="percent" data-i18n="discount_percent"></option>
            </select>
            <input id="discountValue" class="input" type="number" style="width: 120px;" value="0" />
          </div>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span data-i18n="total"></span>
          <strong id="totalValue">0</strong>
        </div>
      </div>

      <div class="grid two" style="margin-top: 16px;">
        <div>
          <label class="tag" data-i18n="order_type"></label>
          <select id="orderTypeSelect"></select>
        </div>
        <div>
          <label class="tag" data-i18n="payment_method"></label>
          <select id="paymentMethodSelect"></select>
        </div>
      </div>

      <button id="completeOrder" class="btn primary" style="margin-top: 18px;" data-i18n="complete_order"></button>
      <p id="orderMessage" class="helper" style="margin-top: 8px;"></p>
    </section>
  </main>

  <div id="deviceOverlay" class="overlay hidden">
    <div class="modal card">
      <h2 data-i18n="device_not_assigned"></h2>
      <p class="helper" data-i18n="waiting_for_assignment"></p>
    </div>
  </div>

  <div id="cashierLogin" class="overlay">
    <div class="modal card">
      <h2 data-i18n="login_title"></h2>
      <input id="cashierCodeInput" class="input" data-i18n-placeholder="enter_code" />
      <button id="cashierLoginBtn" class="btn primary" data-i18n="login"></button>
      <p id="cashierLoginError" class="helper" style="color: var(--danger);"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="translation.js"></script>
  <script src="cashier.js"></script>
</body>
</html>
