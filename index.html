<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="app_title">نظام كاشير وإدارة</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page center">
    <div class="card hero">
      <img src="logo.png" class="logo" alt="logo" />
      <h1 class="title" data-i18n="app_title">نظام كاشير وإدارة</h1>
      <p class="subtitle" data-i18n="home_subtitle">اختر القسم للدخول</p>

      <div class="stack">
        <a class="btn primary" href="cashier.html" data-i18n="btn_cashier">الكاشير</a>
        <a class="btn secondary" href="accounting.html" data-i18n="btn_accounting">المحاسبة والمخازن</a>
      </div>

      <div class="row between mt">
        <button class="btn ghost" id="langBtn" data-i18n="btn_language">تغيير اللغة</button>
        <div class="pill">
          <span data-i18n="label_current_lang">اللغة</span>:
          <b id="langLabel">AR</b>

      </div>
    </div>
    <footer class="footer">
      <span data-i18n="footer_note">واجهة احترافية + تحديث لحظي عبر Firebase</span>

  <script src="translation.js"></script>

</html>
