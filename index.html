<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashier System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page center">
    <div class="logo-wrap">
      <img src="logo.png" alt="logo" />
      <h1 data-i18n="app_title"></h1>
      <p class="subtitle" data-i18n="app_subtitle"></p>
    </div>

    <div class="stack">
      <button id="go-cashier" class="btn primary" data-i18n="go_cashier"></button>
      <button id="go-accounting" class="btn secondary" data-i18n="go_accounting"></button>
    </div>

    <div class="lang-toggle">
      <button class="btn" data-lang="ar" data-i18n="arabic"></button>
      <button class="btn" data-lang="en" data-i18n="english"></button>
    </div>
  </div>

  <script src="translation.js"></script>
  <script src="script.js"></script>
</body>
</html>
